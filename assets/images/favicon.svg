  <!-- Subtle inner border in light linen -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="12" fill="none" stroke="#F5F5F0" stroke-width="1.2" stroke-opacity="0.35"/>
  
  <!-- Sales Growth Vector / Ascending Delta -->
  <!-- Ascending Revenue Bars -->
  <rect x="14" y="38" width="6" height="14" rx="2" fill="#F5F5F0" fill-opacity="0.85"/>
  <rect x="23" y="30" width="6" height="22" rx="2" fill="#F5F5F0" fill-opacity="0.85"/>
  <rect x="32" y="22" width="6" height="30" rx="2" fill="#F5F5F0" fill-opacity="0.85"/>
  <rect x="41" y="14" width="6" height="38" rx="2" fill="#F5F5F0"/>
  
  <!-- Upward Trendline & Delta Indicator -->
